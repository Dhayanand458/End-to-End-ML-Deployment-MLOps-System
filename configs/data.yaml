dataset: cifar10
root_dir: artifacts/data
reference:
  count: 10000
  seed: 42
  split: train
production:
  batch_count: 2000
  split: test
  seed: 4242
  corruptions: [gaussian_noise, defocus_blur, jpeg_compression, snow, brightness]
  severity: 3                # 1..5 (Tiny‑ImageNet‑C like)
  out_dir: artifacts/data/production
features:
  image_size: 32
  compute_embeddings: true   # Milestone B enables embedding reference
  parquet_dir: artifacts/reference/features
embeddings:
  backbone: resnet18
  pca_dims: 20
  cache_dir: artifacts/reference/embeddings
