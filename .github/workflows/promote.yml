name: promote

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  by-comment:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/promote')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mlflow
        run: pip install mlflow
      - name: Promote latest Staging -> Production
        env:
          PR_NUMBER: \${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import mlflow, json, pathlib
          mlflow.set_tracking_uri("file:./mlruns")
          from mlflow.tracking import MlflowClient
          c = MlflowClient()
          name = "driftradar-vision-resnet18"
          vers = c.search_model_versions(f"name='{name}'")
          cand = [v for v in vers if v.current_stage=="Staging"]
          assert cand, "No staging model found"
          cand = sorted(cand, key=lambda v:int(v.version))[-1]
          c.transition_model_version_stage(name, cand.version, stage="Production", archive_existing_versions=True)
          # Update dashboard metadata
          m = {
            "current_production": {
              "model_name": name,
              "version": int(cand.version),
              "run_id": cand.run_id
            }
          }
          pathlib.Path("dashboard/metadata.json").write_text(json.dumps(m, indent=2))
          PY
      - name: Commit metadata update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dashboard/metadata.json
          git commit -m "Promote to Production via comment"
          git push

  on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'model:retrain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mlflow
        run: pip install mlflow
      - name: Promote Staging -> Production (on merge)
        run: |
          python - <<'PY'
          import mlflow, json, pathlib
          mlflow.set_tracking_uri("file:./mlruns")
          from mlflow.tracking import MlflowClient
          c = MlflowClient()
          name = "driftradar-vision-resnet18"
          vers = c.search_model_versions(f"name='{name}'")
          cand = [v for v in vers if v.current_stage=="Staging"]
          assert cand, "No staging model found"
          cand = sorted(cand, key=lambda v:int(v.version))[-1]
          c.transition_model_version_stage(name, cand.version, stage="Production", archive_existing_versions=True)
          m = {"current_production": {"model_name": name, "version": int(cand.version), "run_id": cand.run_id}}
          pathlib.Path("dashboard/metadata.json").write_text(json.dumps(m, indent=2))
          PY
      - name: Commit metadata
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dashboard/metadata.json
          git commit -m "Promote to Production (PR merged)"
          git push
