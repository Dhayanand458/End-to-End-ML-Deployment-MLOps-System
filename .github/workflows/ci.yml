
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Lint and type checks
        run: |
          python -m flake8 src || true
          python -m mypy --ignore-missing-imports src || true

      - name: Cache CIFAR-10 dataset
        uses: actions/cache@v4
        with:
          path: artifacts/data/cifar-10-batches-py
          key: ${{ runner.os }}-cifar10-dataset-v1

      - name: Mini pipeline smoke
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m driftradar_vision.data_ref --count 100 --seed 42
          python -m driftradar_vision.features --config-path configs --config-name data-ci.yaml
          python -m driftradar_vision.dq_validate --config-path configs --config-name dq.yaml
          python -m driftradar_vision.data_prod --batch-count 10 --split test --seed 4242 --corruptions gaussian_noise --severity 2
          python -m driftradar_vision.drift_check --config-path configs --config-name drift.yaml --data-config-path configs --data-config-name data-ci.yaml

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
