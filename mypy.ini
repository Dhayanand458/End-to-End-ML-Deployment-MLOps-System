[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
follow_imports = skip
pretty = True
allow_redefinition = True
disallow_untyped_defs = False
check_untyped_defs = False
no_warn_no_return = True
disable_error_code = misc,annotation-unchecked,type-arg,no-redef,return-value,call-arg

files = src/driftradar_vision, dashboard
exclude = (?x)^(tests/|artifacts/|dashboard/assets/)

[mypy-dashboard.*]
ignore_errors = True

[mypy-driftradar_vision.prediction_drift]
ignore_errors = True

[mypy-driftradar_vision.backtest]
ignore_errors = True

[mypy-driftradar_vision.artifacts]
ignore_errors = True

[mypy-driftradar_vision.predict]
ignore_errors = True

[mypy-driftradar_vision.metrics]
ignore_errors = True

[mypy-driftradar_vision.utils.*]
ignore_errors = True

[mypy-driftradar_vision.registry]
ignore_errors = True

[mypy-driftradar_vision.dq_validate]
ignore_errors = True

[mypy-driftradar_vision.eval]
ignore_errors = True
